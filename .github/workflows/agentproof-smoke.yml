name: AgentProof smoke test

on:
  push:
    branches:
      - agentproof-mvp
  pull_request:
    branches:
      - main
      - agentproof-mvp

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Check facilitator supports Solana exact
        run: |
          curl -fsS https://facilitator.payai.network/supported | tee /tmp/supported.json
          node - <<'NODE'
          const r = require('/tmp/supported.json');
          const text = JSON.stringify(r);
          if (!text.includes('solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp') && !text.includes('"solana"')) {
            throw new Error('Facilitator does not advertise Solana support');
          }
          console.log('PayAI facilitator advertises Solana support');
          NODE

      - name: Start server without payment bypass
        env:
          PAY_TO: "8GZJ4rdBzb3YpThF3e6kcoY4QiEek453f3NxvTUxpbfb"
          FACILITATOR_URL: "https://facilitator.payai.network"
          X402_NETWORK: "solana:5eykt4UsFv8P8NJdTREpY1vzqKqZKvdp"
          PORT: "4020"
        run: |
          nohup npm run server > /tmp/agentproof-paid.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4020/health; then
              echo
              break
            fi
            sleep 1
          done

      - name: Verify paid endpoint returns 402
        run: |
          status=$(curl -sS -D /tmp/paid-headers.txt -o /tmp/paid-response.json -w '%{http_code}'             -X POST http://127.0.0.1:4020/verify             -H 'content-type: application/json'             --data '{"claim":"example domains","sources":["https://www.iana.org/help/example-domains"]}')
          cat /tmp/paid-headers.txt
          cat /tmp/paid-response.json
          test "$status" = "402"
          grep -Eqi 'payment-required|payment-signature' /tmp/paid-headers.txt

      - name: Server log on failure
        if: failure()
        run: cat /tmp/agentproof-paid.log
