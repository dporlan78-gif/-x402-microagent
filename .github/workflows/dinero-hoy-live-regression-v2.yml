name: Dinero Hoy Live Regression V2

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - name: Verify latest approved release metadata
        shell: bash
        env:
          SUPABASE_URL: https://dvhxmafeokzquewpwepu.supabase.co
          SUPABASE_KEY: sb_publishable_6tQ2XAqso0jDQz44ZooGtA_s7E5d0fl
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error -X POST "$SUPABASE_URL/rest/v1/rpc/get_latest_approved_release_status" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" --data '{}')
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.status')" = "APPROVED"
          test "$(echo "$response" | jq -r '.release_id')" = "REL-2026-10-10-001"
          test "$(echo "$response" | jq -r '.engine_version')" = "engine-0.1.24"
          test "$(echo "$response" | jq -r '.data_snapshot_id')" = "1f42a628-1fc3-4f2a-b15d-c75978900748"
          test "$(echo "$response" | jq -r '.tests_passed')" = "7"
          test "$(echo "$response" | jq -r '.tests_failed')" = "0"

      - name: Run live engine regression twice for reproducibility
        shell: bash
        env:
          SUPABASE_URL: https://dvhxmafeokzquewpwepu.supabase.co
          SUPABASE_KEY: sb_publishable_6tQ2XAqso0jDQz44ZooGtA_s7E5d0fl
          SNAPSHOT_ID: 1f42a628-1fc3-4f2a-b15d-c75978900748
          EXPECTED_ENGINE_VERSION: engine-0.1.24
        run: |
          set -euo pipefail
          endpoint="$SUPABASE_URL/functions/v1/dinero-hoy-engine"
          for repetition in 1 2; do
            for profile in TEST_01 TEST_02 TEST_03 TEST_04 TEST_05 REGRESSION_MULTI_019 TEST_NEW_CUSTOMER_01; do
              echo "=== repetition=$repetition profile=$profile ==="
              response=$(curl --fail-with-body --silent --show-error -X POST "$endpoint" -H "apikey: $SUPABASE_KEY" -H "Authorization: Bearer $SUPABASE_KEY" -H "Content-Type: application/json" --data "{\"profile_name\":\"$profile\",\"data_snapshot_id\":\"$SNAPSHOT_ID\"}")
              echo "$response" | jq .
              test "$(echo "$response" | jq -r '.ok')" = "true"
              test "$(echo "$response" | jq -r '.engine_version')" = "$EXPECTED_ENGINE_VERSION"
              test "$(echo "$response" | jq -r '.result.data_snapshot_id')" = "$SNAPSHOT_ID"
              test "$(echo "$response" | jq -r '.result.portfolio.assigned <= .result.portfolio.total')" = "true"
              if [[ "$profile" == "TEST_05" ]]; then
                tr="$(echo "$response" | jq '[.result.recommendations[] | select(.product_id == "b927d07f-4d74-4dc6-82dc-54fa21c7d31c")]')"
                test "$(echo "$tr" | jq 'length')" -ge 1
                test "$(echo "$tr" | jq 'all(.[]; .amount <= 50000 and .tae <= 2.27)')" = "true"
              fi
              if [[ "$profile" == "TEST_NEW_CUSTOMER_01" ]]; then
                tr="$(echo "$response" | jq '[.result.recommendations[] | select(.product_id == "b927d07f-4d74-4dc6-82dc-54fa21c7d31c")]')"
                test "$(echo "$tr" | jq 'length')" -ge 1
                test "$(echo "$tr" | jq 'all(.[]; .amount <= 50000 and .tae == 3.04)')" = "true"
              fi
            done
          done

      - name: Smoke test the public app endpoint
        shell: bash
        env:
          SUPABASE_URL: https://dvhxmafeokzquewpwepu.supabase.co
          SUPABASE_KEY: sb_publishable_6tQ2XAqso0jDQz44ZooGtA_s7E5d0fl
          SNAPSHOT_ID: 1f42a628-1fc3-4f2a-b15d-c75978900748
        run: |
          set -euo pipefail
          response=$(curl --fail-with-body --silent --show-error --connect-timeout 10 --max-time 90 \
            -X POST "$SUPABASE_URL/functions/v1/dinero-hoy-app" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Authorization: Bearer $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            --data '{"capital":50000,"horizon_months":12,"liquidity_requirement":"FULL","risk_level":"VERY_LOW","accepts_conditions":false,"is_new_customer":true}')
          echo "$response" | jq .
          test "$(echo "$response" | jq -r '.ok')" = "true"
          test "$(echo "$response" | jq -r '.engine_version')" = "engine-0.1.24"
          test "$(echo "$response" | jq -r '.snapshot')" = "$SNAPSHOT_ID"
          test "$(echo "$response" | jq -r '.portfolio.complete')" = "true"
          test "$(echo "$response" | jq -r '.recommendations[0].tae')" = "3.04"
          test "$(echo "$response" | jq -r '.recommendations[0].amount')" = "50000"
