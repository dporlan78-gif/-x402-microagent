name: Microagent Scanner

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Scan
        run: npm run agent

      - name: Commit report
        run: |
          git config user.name "x402-microagent"
          git config user.email "actions@users.noreply.github.com"
          git add data/latest-report.json
          git diff --cached --quiet || git commit -m "chore: update opportunity report"
          git push
