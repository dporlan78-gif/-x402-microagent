services:
  - type: web
    name: agentproof-x402
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: PAY_TO
        sync: false
      - key: CDP_API_KEY_ID
        sync: false
      - key: CDP_API_KEY_SECRET
        sync: false
      - key: X402_NETWORK
        value: eip155:84532
      - key: PORT
        value: "4020"
